---

# Used for redmine git integration and remote git repositories
# (git bare repositories as mirror)
git_mirrors_root: /srv/mirrors

git_mirrors: []
# - name: yourrepo (used as subdirectory for checkout)
#   repo: git.github.com:yourname/target-repo-name
#   version: dev

git_mirrors_packages:
  - git
  - git-svn
  - subversion

# Removed, because svn mirrors use git svn and svn2git depends on the
# distribution ruby, which blocks replacing it with a compiled ruby
git_mirrors_obsolete_packages:
  - svn2git
