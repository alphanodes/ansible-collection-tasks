---
- name: Converge
  hosts: all

  pre_tasks:
    - name: Update apt cache.
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      changed_when: false

    - name: Install required packages.
      ansible.builtin.apt:
        name:
          - git
          - rsync
        state: present

    # The role uses 'set -o pipefail' in shell tasks. /bin/sh is dash on
    # Debian containers, which does not support pipefail. Production servers
    # typically have bash; in the test container we relink /bin/sh to bash.
    - name: Ensure /bin/sh is bash (for pipefail support in shell tasks)
      ansible.builtin.file:
        src: /bin/bash
        dest: /bin/sh
        state: link
        force: true

    - name: Set email for git
      ansible.builtin.command: git config --global user.email "me@home.com"
      changed_when: false

    - name: Set name for git
      ansible.builtin.command: git config --global user.user "Just Me"
      changed_when: false

    - name: Set default branch
      ansible.builtin.command: git config --global init.defaultBranch "main"
      changed_when: false

    - name: Create certbot renewal directory
      ansible.builtin.file:
        path: /etc/letsencrypt/renewal
        state: directory
        mode: '0755'

    - name: Create test git repo directory
      ansible.builtin.file:
        path: /git_repo
        state: directory
        mode: '0755'

    - name: Initialize local git repo for tests
      ansible.builtin.shell: >
        cd /git_repo &&
        git init &&
        git config receive.denyCurrentBranch updateInstead &&
        touch dummy.txt &&
        git add -A &&
        git commit -m 'first commit'
      args:
        creates: /git_repo/.git/HEAD

    # certbot rewrites the [acme_renewal_info] block on its own schedule, so
    # renewal configs are excluded from the sync. Mimic one to verify that.
    - name: Create a certbot renewal config
      ansible.builtin.copy:
        dest: /etc/letsencrypt/renewal/molecule_test.conf
        mode: '0644'
        content: |
          version = 5.7.0
          [renewalparams]
          authenticator = dns-hetzner
          [acme_renewal_info]
          ari_retry_after = 2026-09-03T10:48:10

  vars:
    system_watch_repo: file:///git_repo

  roles:
    - role: alphanodes.tasks.system_watch
