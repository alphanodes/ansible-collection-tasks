---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: instance
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian13}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    pre_build_image: true
    cgroupns_mode: host
provisioner:
  name: ansible
  options:
    diff: true
  config_options:
    defaults:
      interpreter_python: auto_silent
  inventory:
    group_vars:
      all:
        # generated once per run into the ephemeral directory, so that no
        # password literal has to be stored in the repository. The trailing
        # special characters are part of the test: they are what breaks naive
        # quoting when the password is handed over to pg_dump.
        molecule_db_password_file: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') | default('/tmp', true) }}/db_password"
        molecule_db_password: "{{ lookup('password', molecule_db_password_file + ' chars=ascii_letters,digits length=20') }}~a}b#c"
  playbooks:
    converge: ${MOLECULE_PLAYBOOK:-converge.yml}
# Backup tasks are by design non-idempotent: each run creates a fresh backup
# file with a new timestamp (gzip header) and new sha256 hash file.
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
