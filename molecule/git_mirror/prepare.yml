---
- name: Prepare
  hosts: all

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600

    # Existing installations got svn2git from older role versions
    - name: Install svn2git like older role versions
      ansible.builtin.apt:
        name: svn2git
        state: present

    - name: Install git for the test repositories
      ansible.builtin.apt:
        name: git
        state: present

    # Upstream with a default, a stable and an old branch and a tag, mirrored
    # by converge.yml. target.git starts empty and gets every branch,
    # filtered.git already holds all branches from an earlier full mirror and
    # must end up with the selected ones only.
    - name: Create the upstream and the push target repositories
      ansible.builtin.shell: |
        set -e
        git init -q -b master /srv/upstream
        cd /srv/upstream
        git -c user.name=test -c user.email=test@example.com commit -q --allow-empty -m initial
        git branch stable
        git branch old
        git tag v1.0
        git init -q --bare /srv/target.git
        git init -q --bare /srv/filtered.git
        git push -q --mirror /srv/filtered.git
      args:
        executable: /bin/bash
        creates: /srv/target.git
