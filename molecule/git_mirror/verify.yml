---
- name: Verify
  hosts: all
  gather_facts: false

  tasks:
    - name: Gather package facts
      ansible.builtin.package_facts:

    - name: Check git-svn is installed and svn2git is removed
      ansible.builtin.assert:
        that:
          - "'git-svn' in ansible_facts.packages"
          - "'subversion' in ansible_facts.packages"
          - "'svn2git' not in ansible_facts.packages"

    - name: Check git svn works
      ansible.builtin.command: git svn --version
      changed_when: false

    - name: Read the branches and tags of the filtered push target
      ansible.builtin.command:
        argv:
          - git
          - --git-dir=/srv/filtered.git
          - for-each-ref
          - --format=%(refname)
      register: filtered_refs
      changed_when: false

    - name: Assert the filtered push target holds only the selected branches and all tags
      ansible.builtin.assert:
        that:
          - filtered_refs.stdout_lines | sort == ['refs/heads/master', 'refs/heads/stable', 'refs/tags/v1.0']
        fail_msg: 'unexpected refs in the filtered push target: {{ filtered_refs.stdout_lines }}'

    # A backport on a stable branch that an earlier run already fetched but
    # never pushed, e.g. by a role version that only pushed when the default
    # branch moved or after a failed push. Fetching again finds nothing new,
    # the push target must catch up anyway.
    - name: Add a commit to the stable branch and fetch it into the local mirrors only
      ansible.builtin.shell: |
        set -e
        cd /srv/upstream
        git checkout -q stable
        git -c user.name=test -c user.email=test@example.com commit -q --allow-empty -m backport
        git checkout -q master
        for mirror in test filtered; do
          git --git-dir=/srv/mirrors/$mirror fetch -q /srv/upstream '+refs/heads/*:refs/heads/*'
        done
      args:
        executable: /bin/bash
      changed_when: true

    - name: Run the mirror again
      ansible.builtin.include_role:
        name: alphanodes.tasks.git_mirror
      vars:
        git_mirrors:
          - name: test
            repo: /srv/upstream
            push_to: /srv/target.git
          - name: filtered
            repo: /srv/upstream
            push_to: /srv/filtered.git
            branches:
              - master
              - stable

    - name: Read the stable branch of upstream and the push targets
      ansible.builtin.command:
        argv:
          - git
          - '--git-dir={{ item }}'
          - rev-parse
          - refs/heads/stable
      loop:
        - /srv/upstream/.git
        - /srv/target.git
        - /srv/filtered.git
      register: stable_heads
      changed_when: false

    - name: Assert the stable commit reached both push targets
      ansible.builtin.assert:
        that:
          - stable_heads.results[1].stdout == stable_heads.results[0].stdout
          - stable_heads.results[2].stdout == stable_heads.results[0].stdout
        fail_msg: a commit fetched earlier but never pushed did not reach the mirror targets

    # A branch deleted upstream (e.g. master renamed to main) must disappear
    # from the local mirror too, otherwise --mirror pushes it back, which
    # fails when the target protects that branch name
    - name: Delete the old branch upstream
      ansible.builtin.command: git -C /srv/upstream branch -D old
      changed_when: true

    - name: Run the mirror after the upstream deletion
      ansible.builtin.include_role:
        name: alphanodes.tasks.git_mirror
      vars:
        git_mirrors:
          - name: test
            repo: /srv/upstream
            push_to: /srv/target.git

    - name: Read the branches of the local mirror and the push target
      ansible.builtin.command:
        argv:
          - git
          - '--git-dir={{ item }}'
          - for-each-ref
          - --format=%(refname)
          - refs/heads
      loop:
        - /srv/mirrors/test
        - /srv/target.git
      register: pruned_heads
      changed_when: false

    - name: Assert the deleted branch is gone from the local mirror and the push target
      ansible.builtin.assert:
        that:
          - item.stdout_lines | sort == ['refs/heads/master', 'refs/heads/stable']
        fail_msg: 'unexpected branches in {{ item.item }}: {{ item.stdout_lines }}'
      loop: '{{ pruned_heads.results }}'
      loop_control:
        label: '{{ item.item }}'
