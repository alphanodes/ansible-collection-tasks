---
- name: Converge
  hosts: all

  pre_tasks:
    - name: Update apt cache.
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      changed_when: false

    - name: Install cron.
      ansible.builtin.apt:
        name: git
        state: present

  vars:
    git_mirrors:
      - name: test
        repo: /srv/upstream
        push_to: /srv/target.git
      # future does not exist upstream yet and is skipped
      - name: filtered
        repo: /srv/upstream
        push_to: /srv/filtered.git
        branches:
          - master
          - stable
          - future

  roles:
    - role: alphanodes.tasks.git_mirror
